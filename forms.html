<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB APPLICATION</title>
</head>
<body>
    <h1>JOB APPLICATION</h1>
    <form>
        <label for="full name">Full Name</label>
        <input id="fullName" type="text" placeholder="eg.nila" required minlength="3" maxlength="7">
        <br>
        <!-- email -->
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="your mail id" required >
        <br>
        <!-- Gender -->
          <input id="male" type="radio" value="male>
          <label for="male" >Male</label>
           <input id="female" type="radio" value="Female">
          <label for="female">Female</label>


           <label for="gender">Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

     <br>
     <br>
     <!-- position -->
      <label for="position">POSITION</label>
      <select name="position" id="position">
        <option value="">Select your position</option>
        <option value="Front-end">Front-end</option>
        <option value="Back-end">Back-end></option>

      </select>
      <br>
     <button type="submit">Submit</button>
        
    </form>
    
</body>
</html>
